name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download offline speech model (Vosk, Indian English)
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/vosk-model
          mv vosk-model-small-en-in-0.4 app/src/main/assets/vosk-model
          rm model.zip

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: call-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
